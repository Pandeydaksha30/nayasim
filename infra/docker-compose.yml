# Local development database for ContractIQ (PostgreSQL 17 + pgvector). Not used for deployment:
# production uses Render PostgreSQL (render.yaml).
# Start:  docker compose -f infra/docker-compose.yml up -d
# Second copy on another port (e.g. a fresh install next to this one):
#   PG_PORT=5433 docker compose -p nyayasim-fresh -f infra/docker-compose.yml up -d postgres
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyayasim
      POSTGRES_PASSWORD: nyayasim_local_only
      POSTGRES_DB: nyayasim
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayasim"]
      interval: 5s
      retries: 10


volumes:
  pgdata:
