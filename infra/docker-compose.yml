# Local services for NyayaSim. Not used until the order store (step 3).
# Start:  docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyayasim
      POSTGRES_PASSWORD: nyayasim_local_only
      POSTGRES_DB: nyayasim
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayasim"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
