[project]
name = "nyayasim-backend"
version = "0.1.0"
description = "NyayaSim API: deterministic calculators, order store, retrieval and agents."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "sqlalchemy==2.0.57",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "pgvector==0.4.2",
    "pypdfium2==5.15.0",
    "pytesseract==0.3.13",
    "pillow==12.3.0",
    "google-genai==2.8.0",
    "rapidfuzz==3.14.6",
    "python-multipart==0.0.33",
    "fastembed==0.9.1",
    "langgraph==1.2.20",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "email-validator==2.3.0",
    "scikit-learn==1.7.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.3",
    "fpdf2==2.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migrations hold SQL as text; long lines keep each column definition readable.
"migrations/versions/*.py" = ["E501"]
# Holds fictional document text verbatim.
"scripts/demo_buyer_case.py" = ["E501"]
# Prompt text for the hearing agents.
"app/hearing/agents.py" = ["E501"]
